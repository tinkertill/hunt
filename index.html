:root{--c:#E2725B;--d:#B3502F;--bg1:#FFE9E2;--bg2:#FFD3C4;--ink:#2B2233;--soft:#FFF4EF;--gold:#F6B826}
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
html,body{height:100%}
body{font-family:"Fredoka","Baloo 2","Comic Sans MS",system-ui,sans-serif;color:var(--ink);
 background:radial-gradient(120% 70% at 50% 0%,var(--bg1) 0%,var(--bg2) 100%);min-height:100dvh;overflow-x:hidden;-webkit-tap-highlight-color:transparent}
.wrap{position:relative;z-index:2;min-height:100dvh;display:flex;flex-direction:column;align-items:center;
 padding:calc(18px + env(safe-area-inset-top)) 18px calc(14px + env(safe-area-inset-bottom));max-width:560px;margin:0 auto;gap:14px}

/* ---------- header ---------- */
.top{width:100%;text-align:center;padding-top:4px}
.chip{display:inline-flex;align-items:center;gap:8px;background:rgba(255,255,255,.85);border-radius:999px;padding:6px 14px 6px 8px;
 font-weight:600;font-size:14px;color:var(--d);box-shadow:0 4px 14px rgba(0,0,0,.08)}
.chip .em{font-size:20px;line-height:1}
h1{margin-top:12px;font-size:clamp(28px,8.4vw,40px);line-height:1.05;font-weight:700;color:var(--d);
 text-shadow:0 3px 0 rgba(255,255,255,.7)}

/* ---------- trail ---------- */
.trail{width:100%;display:flex;align-items:center;justify-content:center;gap:0;margin-top:2px}
.dot{flex:0 0 auto;width:22px;height:22px;border-radius:50%;background:rgba(255,255,255,.75);border:3px solid rgba(255,255,255,.95);
 display:grid;place-items:center;font-size:11px;font-weight:700;color:#fff;box-shadow:0 2px 6px rgba(0,0,0,.08)}
.dot.done{background:var(--c);border-color:#fff}
.dot.now{width:38px;height:38px;font-size:20px;background:#fff;border:4px solid var(--c);animation:pulse 1.6s ease-in-out infinite}
.dot.goal{width:30px;height:30px;font-size:17px;background:#fff;border-color:var(--gold)}
.dot.goal.now{width:44px;height:44px;font-size:24px;border-color:var(--gold)}
.line{flex:1 1 auto;height:4px;min-width:4px;max-width:22px;background:rgba(255,255,255,.75);border-radius:2px}
.line.done{background:var(--c)}
@keyframes pulse{0%,100%{transform:scale(1);box-shadow:0 0 0 0 rgba(255,255,255,.9)}50%{transform:scale(1.08);box-shadow:0 0 0 8px rgba(255,255,255,0)}}
.step{font-size:16px;font-weight:600;color:var(--d);margin-top:8px}

/* ---------- clue card ---------- */
.card{position:relative;width:100%;background:#fff;border-radius:30px;padding:56px 22px 22px;text-align:center;
 box-shadow:0 22px 50px rgba(0,0,0,.16),0 0 0 6px rgba(255,255,255,.55);margin-top:30px;animation:pop .55s cubic-bezier(.2,1.4,.4,1)}
@keyframes pop{from{transform:scale(.8) rotate(-2deg);opacity:0}to{transform:none;opacity:1}}
.badge{position:absolute;top:-42px;left:50%;transform:translateX(-50%);width:84px;height:84px;border-radius:50%;
 background:var(--c);border:6px solid #fff;display:grid;place-items:center;font-size:42px;box-shadow:0 8px 20px rgba(0,0,0,.18)}
.end .badge{background:var(--gold);animation:wiggle 1.2s ease-in-out infinite}
@keyframes wiggle{0%,100%{transform:translateX(-50%) rotate(-8deg)}50%{transform:translateX(-50%) rotate(8deg) scale(1.08)}}
.label{display:inline-block;font-size:13px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--c);
 background:var(--soft);border-radius:999px;padding:5px 12px}
.clue{margin-top:14px;font-size:clamp(25px,7.2vw,32px);line-height:1.3;font-weight:600}
.end .clue{font-size:clamp(25px,7.2vw,32px)}
.say{margin-top:20px;display:inline-flex;align-items:center;gap:10px;border:0;cursor:pointer;font:inherit;font-weight:600;font-size:18px;
 color:#fff;background:var(--c);border-radius:999px;padding:12px 22px 12px 14px;box-shadow:0 6px 0 var(--d);transition:transform .1s}
.say:active{transform:translateY(4px);box-shadow:0 2px 0 var(--d)}
.say .sp{width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,.25);display:grid;place-items:center;font-size:18px}
.say.on .sp{animation:pulse 1s infinite}

/* ---------- next-step tip ---------- */
.tip{width:100%;display:flex;align-items:center;gap:12px;background:rgba(255,255,255,.8);border-radius:22px;padding:12px 16px;
 box-shadow:0 6px 18px rgba(0,0,0,.08);font-size:16px;font-weight:500;line-height:1.3;text-align:left}
.tip .ti{flex:0 0 auto;width:46px;height:46px;border-radius:14px;background:var(--soft);display:grid;place-items:center;font-size:26px}
.tip b{color:var(--d);font-weight:700}

/* ---------- scene at the bottom ---------- */
.mid{flex:1 1 auto;width:100%;display:flex;flex-direction:column;justify-content:center;gap:16px}
.scene{width:100%;display:flex;justify-content:space-between;align-items:flex-end;font-size:44px;line-height:1;padding:0 6px;pointer-events:none}
.scene span{display:inline-block;animation:bob 3s ease-in-out infinite}
.scene span:nth-child(2){animation-delay:.5s;font-size:56px}.scene span:nth-child(3){animation-delay:1s}
.scene span:nth-child(4){animation-delay:1.5s;font-size:56px}.scene span:nth-child(5){animation-delay:2s}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
footer{font-size:13px;color:var(--d);opacity:.75;text-align:center;font-weight:500}

/* ---------- background decorations ---------- */
.sky{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.sky i{position:absolute;font-style:normal;opacity:.55;animation:drift linear infinite}
@keyframes drift{from{transform:translateY(-12vh) rotate(0)}to{transform:translateY(112vh) rotate(360deg)}}
.sky i.tw{animation:twinkle 2.4s ease-in-out infinite}
@keyframes twinkle{0%,100%{opacity:.15;transform:scale(.7)}50%{opacity:.9;transform:scale(1.1)}}
.ground{position:fixed;left:-10%;right:-10%;bottom:-60px;height:170px;border-radius:50% 50% 0 0;z-index:1;pointer-events:none;background:var(--ground,rgba(255,255,255,.6))}

/* confetti lives BEHIND the card (z-index 1) so the clue is always readable */
.confetti{position:fixed;inset:0;z-index:1;pointer-events:none;overflow:hidden}
.confetti b{position:absolute;top:-24px;width:10px;height:16px;border-radius:3px;animation:fall linear infinite}
@keyframes fall{to{transform:translateY(115vh) rotate(720deg)}}

/* ---------- themes ---------- */
body.xmas{--c:#C8313A;--d:#8E1B24;--bg1:#FFF1EC;--bg2:#F9CFC6;--soft:#FDEBEA;--ground:#FFFFFF}
body.pirate{--c:#1F6FA8;--d:#123F63;--bg1:#E7F6FF;--bg2:#9FD6F2;--soft:#E8F3FB;--ground:#F3D9A4}
body.space{--c:#6A3FD1;--d:#F2E9FF;--bg1:#2A1A5E;--bg2:#0E0A2B;--soft:#EFE8FF;--ground:#3B2B7A;--ink:#2B2233}
body.space h1,body.space .step,body.space footer{color:#F2E9FF}
body.space h1{text-shadow:0 3px 0 rgba(0,0,0,.35)}
body.space .chip{color:#4B2A8C}
body.space .say{box-shadow:0 6px 0 #3F2192}
body.space .say:active{box-shadow:0 2px 0 #3F2192}
body.space .tip b{color:#4B2A8C}
body.space .dot{background:rgba(255,255,255,.18);border-color:rgba(255,255,255,.4)}
body.space .dot.done{background:var(--c);border-color:#fff}
body.space .dot.now,body.space .dot.goal{background:#fff}
body.space .line{background:rgba(255,255,255,.25)}body.space .line.done{background:var(--c)}
body.space .sky i{opacity:.9}
body.pirate .ground{box-shadow:0 -18px 0 rgba(255,255,255,.45)}

@media (max-height:640px){.scene{display:none}.card{padding-top:50px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style></head><body>
<div class="sky" id="sky"></div><div class="ground"></div>
<main class="wrap">
 <div class="top">
  <div class="chip"><span class="em" id="em">🔍</span><span id="step">TinkerTill</span></div>
  <h1 id="title">Treasure Hunt</h1>
 </div>
 <div id="prog" hidden style="width:100%"><div class="trail" id="trail"></div></div>
 <div class="mid">
 <section class="card" id="card">
  <div class="badge" id="badge">🔍</div>
  <div class="label" id="label">Hello!</div>
  <div class="clue" id="clue">Scan a treasure hunt card with your phone camera to see your clue.</div>
  <button class="say" id="say" hidden><span class="sp">🔊</span><span id="sayt">Read it to me</span></button>
 </section>
 <div class="tip" id="tip" hidden><div class="ti" id="tipi">📷</div><div id="tipt"></div></div>
 </div>
 <div class="scene" id="scene"></div>
 <footer id="foot">Treasure hunt by TinkerTill</footer>
</main>
<script>
/* URL format (do not change, printed QR codes depend on it):  #theme/lang/n/total/base64url(clue) */
const T={
 xmas:{icon:"🎄",goal:"🎁",now:"🎅",fx:["❄️","❄","✨","❅"],fall:true,scene:["🎄","⛄","🎁","🦌","🎄"],conf:["#C8313A","#2E8B57","#F6B826","#FFFFFF","#E85D75"],tc:"#C8313A"},
 pirate:{icon:"🏴‍☠️",goal:"💰",now:"🦜",fx:["🫧","✨","🐚","⭐"],fall:false,scene:["🌴","🦜","🏝️","⛵","🐙"],conf:["#1F6FA8","#F6B826","#E2725B","#2A9D8F","#FFFFFF"],tc:"#1F6FA8"},
 space:{icon:"🚀",goal:"🪐",now:"👩‍🚀",fx:["✦","✧","⋆","✦","·"],fall:false,scene:["🌍","🛸","🌙","🚀","⭐"],conf:["#6A3FD1","#F6B826","#4FD1E8","#FF6FB5","#FFFFFF"],tc:"#2A1A5E"},
 custom:{icon:"🔍",goal:"🏆",now:"⭐",fx:["✨","⭐","🎈","✦"],fall:true,scene:["🎈","⭐","🏆","🎈","⭐"],conf:["#E2725B","#F4C430","#2A9D8F","#4B2A8C","#C0392B"],tc:"#E2725B"}};
const L={
 en:{clue:"Clue {k} of {n}",final:"Final clue!",riddle:"Riddle",treasure:"Treasure time!",read:"Read it to me",stop:"Stop",
  next:"<b>Found the card?</b> Scan it to get the next clue.",last:"<b>Last one!</b> Go find the treasure!",hi:"Hello!",
  xmas:"Christmas Treasure Hunt",pirate:"Pirate Treasure Hunt",space:"Space Mission",custom:"Treasure Hunt",by:"Treasure hunt by TinkerTill",
  idle:"Scan a treasure hunt card with your phone camera to see your clue.",scanTip:"Open the camera and point it at a card."},
 fr:{clue:"Indice {k} sur {n}",final:"Dernier indice !",riddle:"Devinette",treasure:"Le trésor !",read:"Lis-le-moi",stop:"Stop",
  next:"<b>Tu as trouvé la carte ?</b> Scanne-la pour l'indice suivant.",last:"<b>C'est le dernier !</b> Va chercher le trésor !",hi:"Bonjour !",
  xmas:"Chasse au trésor de Noël",pirate:"Chasse au trésor des pirates",space:"Mission spatiale",custom:"Chasse au trésor",by:"Chasse au trésor par TinkerTill",
  idle:"Scanne une carte de la chasse au trésor avec l'appareil photo pour voir ton indice.",scanTip:"Ouvre l'appareil photo et vise une carte."},
 de:{clue:"Hinweis {k} von {n}",final:"Letzter Hinweis!",riddle:"Rätsel",treasure:"Schatzzeit!",read:"Lies es mir vor",stop:"Stopp",
  next:"<b>Karte gefunden?</b> Scanne sie für den nächsten Hinweis.",last:"<b>Der letzte!</b> Jetzt finde den Schatz!",hi:"Hallo!",
  xmas:"Weihnachts-Schatzsuche",pirate:"Piraten-Schatzsuche",space:"Weltraum-Mission",custom:"Schatzsuche",by:"Schatzsuche von TinkerTill",
  idle:"Scanne eine Karte der Schatzsuche mit der Handykamera, um deinen Hinweis zu sehen.",scanTip:"Öffne die Kamera und richte sie auf eine Karte."},
 es:{clue:"Pista {k} de {n}",final:"¡Última pista!",riddle:"Adivinanza",treasure:"¡Hora del tesoro!",read:"Léemelo",stop:"Parar",
  next:"<b>¿Encontraste la tarjeta?</b> Escanéala para la siguiente pista.",last:"<b>¡Es la última!</b> ¡Ve a buscar el tesoro!",hi:"¡Hola!",
  xmas:"Búsqueda del tesoro de Navidad",pirate:"Búsqueda del tesoro pirata",space:"Misión espacial",custom:"Búsqueda del tesoro",by:"Búsqueda del tesoro de TinkerTill",
  idle:"Escanea una tarjeta de la búsqueda con la cámara del móvil para ver tu pista.",scanTip:"Abre la cámara y apunta a una tarjeta."}};
const VOICE={en:"en-US",fr:"fr-FR",de:"de-DE",es:"es-ES"};
const $=id=>document.getElementById(id), R=(a,b)=>a+Math.random()*(b-a);
function dec(b){b=b.replace(/-/g,"+").replace(/_/g,"/");while(b.length%4)b+="=";
 return new TextDecoder().decode(Uint8Array.from(atob(b),c=>c.charCodeAt(0)));}
function sky(th){const s=$("sky");for(let i=0;i<26;i++){const e=document.createElement("i");e.textContent=th.fx[i%th.fx.length];
 e.style.left=R(0,100)+"vw";e.style.fontSize=R(12,30)+"px";
 if(th.fall){e.style.animationDuration=R(9,18)+"s";e.style.animationDelay=-R(0,18)+"s";}
 else{e.className="tw";e.style.top=R(0,100)+"vh";e.style.animationDelay=-R(0,3)+"s";e.style.animationDuration=R(1.8,3.6)+"s";}
 s.appendChild(e);}}
function confetti(cols){const c=document.createElement("div");c.className="confetti";
 for(let i=0;i<90;i++){const p=document.createElement("b");p.style.left=R(0,100)+"vw";p.style.background=cols[i%cols.length];
  p.style.width=R(7,12)+"px";p.style.height=R(10,18)+"px";p.style.animationDuration=R(3,6)+"s";p.style.animationDelay=-R(0,6)+"s";c.appendChild(p);}
 document.body.appendChild(c);}
let lang="en",theme=T.custom;
try{
 const [t,lg,n,of,b]=decodeURIComponent(location.hash.slice(1)).split("/");
 const s=L[lg]||L.en; lang=L[lg]?lg:"en"; theme=T[t]||T.custom; const key=T[t]?t:"custom";
 document.documentElement.lang=lang; document.body.className=key;
 document.querySelector('meta[name=theme-color]').content=theme.tc;
 $("em").textContent=theme.icon; $("title").textContent=s[key]; $("foot").textContent=s.by;
 $("scene").innerHTML=theme.scene.map(x=>"<span>"+x+"</span>").join("");
 sky(theme);
 if(b){
  const k=Math.max(1,+n||1),tot=Math.max(k,+of||k),last=k===tot,txt=dec(b);
  $("badge").textContent=last?theme.goal:theme.icon;
  $("label").textContent=last?s.treasure:s.riddle;
  $("clue").textContent=txt;
  $("step").textContent=last?s.final:s.clue.replace("{k}",k).replace("{n}",tot);
  /* trail of dots */
  let h="";for(let i=1;i<=tot;i++){const st=i<k?"done":i===k?"now":"";
   if(i>1)h+='<span class="line '+(i<=k?"done":"")+'"></span>';
   h+=i===tot?'<span class="dot goal '+st+'">'+theme.goal+'</span>':'<span class="dot '+st+'">'+(i===k?theme.now:i<k?"✓":"")+'</span>';}
  $("trail").innerHTML=h;$("prog").hidden=false;
  $("tipi").textContent=last?theme.goal:"📷";$("tipt").innerHTML=last?s.last:s.next;$("tip").hidden=false;
  if(last){$("card").classList.add("end");confetti(theme.conf);}
  document.title=s[key]+" - "+$("step").textContent;
  /* read aloud for little ones */
  if("speechSynthesis" in window){const btn=$("say");btn.hidden=false;$("sayt").textContent=s.read;
   btn.onclick=()=>{const ss=speechSynthesis;
    if(ss.speaking){ss.cancel();return;}
    const u=new SpeechSynthesisUtterance(txt);u.lang=VOICE[lang];u.rate=.9;u.pitch=1.1;
    const v=ss.getVoices().find(v=>v.lang&&v.lang.toLowerCase().startsWith(lang));if(v)u.voice=v;
    u.onstart=()=>{btn.classList.add("on");$("sayt").textContent=s.stop};
    u.onend=u.onerror=()=>{btn.classList.remove("on");$("sayt").textContent=s.read};
    ss.speak(u);};}
 }else{
  $("label").textContent=s.hi;$("step").textContent=s[key];$("clue").textContent=s.idle;$("badge").textContent="📷";
  $("tipi").textContent="💡";$("tipt").textContent=s.scanTip;$("tip").hidden=false;
 }
}catch(e){}
</script></body></html>
